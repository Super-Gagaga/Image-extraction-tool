[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "image-extraction-tool"
version = "0.1.0"
description = "Windows local image background removal and mask editing tool"
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
    "PySide6>=6.8,<7",
    "Pillow>=11,<13",
    "opencv-python-headless>=4.10,<5",
    "onnxruntime>=1.20,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<10",
    "pytest-qt>=4.4,<5",
]
build = [
    "pyinstaller>=6.11,<7",
]

[project.scripts]
image-extraction-tool = "image_extraction_tool.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/image_extraction_tool"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
qt_api = "pyside6"

